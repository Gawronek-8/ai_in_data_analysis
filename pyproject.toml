[project]
name = "inteligencja-obliczeniowa"
version = "0.1.0"
description = "Projekt RL"
requires-python = ">=3.11,<3.12"
dependencies = [
    "gymnasium[box2d]>=0.29.1",
    "stable-baselines3[extra]>=2.1.0",
    "shimmy>=1.3.0",
    "matplotlib>=3.8.0",
    "tqdm>=4.66.0",
    "numpy>=1.24.0",
    "torch>=2.7.1",
    "pygame>=2.6.1",
    "pymunk>=7.2.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu118", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu118", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
